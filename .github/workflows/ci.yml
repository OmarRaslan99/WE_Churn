name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      load_level:
        description: Load level for the optional CI load test
        required: false
        default: nominal
        type: choice
        options:
          - nominal
          - charge
          - stress
      load_duration:
        description: Duration in seconds for the optional CI load test
        required: false
        default: "30"

env:
  PYTHON_VERSION: "3.12"
  IMAGE_TAG: v0.1.0-seance3

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Train models
        run: uv run python scripts/train_models.py

      - name: Run tests with coverage threshold
        run: uv run pytest

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate model artifacts for image build
        run: |
          uv sync --frozen
          uv run python scripts/train_models.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Build and push preprocessing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/preprocessing/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/we-churn-preprocessing:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USERNAME }}/we-churn-preprocessing:latest

      - name: Build and push monitoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/monitoring/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/we-churn-monitoring:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USERNAME }}/we-churn-monitoring:latest

      - name: Build and push inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inference/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/we-churn-inference:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USERNAME }}/we-churn-inference:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/we-churn-frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USERNAME }}/we-churn-frontend:latest

  load-test:
    name: Docker Compose load test
    runs-on: ubuntu-latest
    needs: test
    env:
      LOAD_LEVEL: ${{ github.event.inputs.load_level || 'nominal' }}
      LOAD_DURATION: ${{ github.event.inputs.load_duration || '30' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies and train models
        run: |
          uv sync --frozen
          uv run python scripts/train_models.py

      - name: Start Docker Compose stack
        run: docker compose up --build -d

      - name: Wait for inference health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Smoke predict
        run: uv run python scripts/smoke_predict.py --url http://localhost:8000/predict

      - name: Run short load test
        run: |
          uv run python scripts/load_test.py \
            --case churn \
            --level "$LOAD_LEVEL" \
            --duration "$LOAD_DURATION" \
            --url http://localhost:8000/predict \
            --output-dir results/ci-load-tests \
            --min-success-rate 95 \
            --max-p95-s 2

      - name: Capture Docker Compose logs
        if: always()
        run: |
          mkdir -p results/ci-load-tests
          docker compose ps > results/ci-load-tests/docker-compose-ps.txt
          docker compose logs --no-color > results/ci-load-tests/docker-compose-logs.txt

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down

      - name: Upload load test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-load-test-results
          path: results/ci-load-tests/