name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_TAG: v0.1.0-seance3

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Train models
        run: uv run python scripts/train_models.py

      - name: Run tests with coverage threshold
        run: uv run pytest --cov

  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Generate model artifacts for image build
        run: |
          uv sync --frozen
          uv run python scripts/train_models.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Build and push preprocessing image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/preprocessing/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/we-churn-preprocessing:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USERNAME }}/we-churn-preprocessing:latest

      - name: Build and push monitoring image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/monitoring/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/we-churn-monitoring:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USERNAME }}/we-churn-monitoring:latest

      - name: Build and push inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/inference/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USERNAME }}/we-churn-inference:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_USERNAME }}/we-churn-inference:latest