apiVersion: v1
kind: LimitRange
metadata:
  name: projet-limits
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1500m"
        memory: "768Mi"
      min:
        cpu: "50m"
        memory: "64Mi"